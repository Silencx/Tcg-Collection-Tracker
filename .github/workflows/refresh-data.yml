name: Refresh card data

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      add:
        description: 'Pokémon to ADD to data/prebuilt.json permanently, comma-separated (e.g. "Pikachu,Eevee"). Leave blank to just rebuild the existing list.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # A manual run APPENDS to data/prebuilt.json rather than building a one-off
      # snapshot, which the next scheduled run would silently overwrite; widening
      # coverage has to be durable to be worth anything.
      - name: Extend the prebuilt list
        if: ${{ inputs.add != '' }}
        env:
          ADD: ${{ inputs.add }}
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "data/prebuilt.json";
            const current = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, "utf8")) : [];
            const add = process.env.ADD.split(",").map(s => s.trim()).filter(Boolean);
            const merged = [...new Set([...current, ...add])];
            if (merged.length > 60) throw new Error(`prebuilt list would reach ${merged.length}; cap is 60 (each entry costs a list request plus pooled detail calls every week)`);
            fs.writeFileSync(file, JSON.stringify(merged, null, 2) + "\n");
            console.log(`prebuilt list: ${current.length} -> ${merged.length}`);
          '

      # No argument: build-data.mjs reads data/prebuilt.json, falling back to
      # DEFAULT_POKEMON. It writes data/sets.json, the per-Pokémon shards under
      # data/cards|jp/, and data/index.json.
      - name: Build data
        run: node tools/build-data.mjs

      # The Japanese card list (data/jp-cat/: every Japanese set, any Pokémon) from
      # PokéWallet, ~490 requests. POKEWALLET_IO_PROD_KEY is optional: without it the
      # script exits cleanly and the committed list stays as it is. Only a COMPLETE walk
      # replaces the committed files, so a run cut short by the quota cannot shrink the
      # list. continue-on-error: a PokéWallet outage must not cost the week's TCGdex refresh.
      - name: Build Japanese card list
        continue-on-error: true
        env:
          POKEWALLET_IO_PROD_KEY: ${{ secrets.POKEWALLET_IO_PROD_KEY }}
        run: node tools/build-jp-catalog.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh card data"
            git push
          fi
