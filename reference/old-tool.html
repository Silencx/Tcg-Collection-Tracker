<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon TCG Master Set Checklist</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,Helvetica,sans-serif;background:var(--c-body-bg,#ecf5ec);color:#1a1a1a;font-size:12px;  --c-set-head-jp:#bf360c;
}

/* ── COLOUR THEME — CSS custom properties ── */
:root{
  /* placeholder card colours */
  --ph-bg1:#1a3a2a;--ph-bg2:#2d5a3d;--ph-border:#c8a400;
  --ph-name:#ffd54f;--ph-native:#ffe082;--ph-set:#a5d6a7;--ph-num:#81c784;
  --ph-inner:rgba(200,164,0,.35);
  /* page-wide accent colours */
  --c-accent1:#1b5e20;--c-accent2:#2e7d32;--c-accent3:#388e3c;
  --c-poke-bar:#1b5e20;--c-poke-bar-border:#145214;
  --c-body-bg:#ecf5ec;
  --c-era:#2e7d32;--c-era-bg:#e8f5e9;
  --c-set-head:#2e7d32;
  --c-card-done-bg:#e8f5e9;--c-card-done-border:#43a047;
  --c-card-hover:#f0f8f0;--c-card-hover-border:#81c784;
  --c-divider:#e8f5e9;--c-divider-text:#2e7d32;--c-divider-alt:#81c784;
}
/* Ocean */
body.palette-ocean{
  --ph-bg1:#0d2137;--ph-bg2:#1a3d5c;--ph-border:#29b6f6;--ph-name:#81d4fa;--ph-native:#b3e5fc;--ph-set:#4fc3f7;--ph-num:#29b6f6;--ph-inner:rgba(41,182,246,.3);
  --c-accent1:#01579b;--c-accent2:#0277bd;--c-accent3:#0288d1;
  --c-poke-bar:#01579b;--c-poke-bar-border:#013a6b;
  --c-body-bg:#e1f0fa;
  --c-era:#0277bd;--c-era-bg:#e1f5fe;
  --c-set-head:#0277bd;
  --c-card-done-bg:#e1f5fe;--c-card-done-border:#0288d1;
  --c-card-hover:#e8f4fd;--c-card-hover-border:#4fc3f7;
  --c-divider:#e1f5fe;--c-divider-text:#0277bd;--c-divider-alt:#4fc3f7;
  --c-set-head-jp:#01579b;
}
/* Dusk */
body.palette-dusk{
  --ph-bg1:#2a1a3a;--ph-bg2:#3d2d5a;--ph-border:#ce93d8;--ph-name:#e1bee7;--ph-native:#f3e5f5;--ph-set:#ce93d8;--ph-num:#ba68c8;--ph-inner:rgba(206,147,216,.3);
  --c-accent1:#4a148c;--c-accent2:#6a1b9a;--c-accent3:#7b1fa2;
  --c-poke-bar:#4a148c;--c-poke-bar-border:#2d0059;
  --c-body-bg:#f3e5f5;
  --c-era:#6a1b9a;--c-era-bg:#f3e5f5;
  --c-set-head:#6a1b9a;
  --c-card-done-bg:#f3e5f5;--c-card-done-border:#8e24aa;
  --c-card-hover:#fce4ec;--c-card-hover-border:#ce93d8;
  --c-divider:#f3e5f5;--c-divider-text:#6a1b9a;--c-divider-alt:#ce93d8;
  --c-set-head-jp:#6a1b9a;
}
/* Fire */
body.palette-fire{
  --ph-bg1:#3a1a0d;--ph-bg2:#5a2d1a;--ph-border:#ff8f00;--ph-name:#ffcc80;--ph-native:#ffe0b2;--ph-set:#ffb74d;--ph-num:#ffa726;--ph-inner:rgba(255,143,0,.3);
  --c-accent1:#bf360c;--c-accent2:#d84315;--c-accent3:#e64a19;
  --c-poke-bar:#bf360c;--c-poke-bar-border:#870000;
  --c-body-bg:#fbe9e7;
  --c-era:#d84315;--c-era-bg:#fbe9e7;
  --c-set-head:#d84315;
  --c-card-done-bg:#fbe9e7;--c-card-done-border:#e64a19;
  --c-card-hover:#fce4e0;--c-card-hover-border:#ffb74d;
  --c-divider:#fbe9e7;--c-divider-text:#d84315;--c-divider-alt:#ffa726;
  --c-set-head-jp:#bf360c;
}
/* Mono */
body.palette-mono{
  --ph-bg1:#1c1c1c;--ph-bg2:#2e2e2e;--ph-border:#9e9e9e;--ph-name:#f5f5f5;--ph-native:#e0e0e0;--ph-set:#bdbdbd;--ph-num:#9e9e9e;--ph-inner:rgba(158,158,158,.3);
  --c-accent1:#424242;--c-accent2:#616161;--c-accent3:#757575;
  --c-poke-bar:#424242;--c-poke-bar-border:#212121;
  --c-body-bg:#f5f5f5;
  --c-era:#616161;--c-era-bg:#eeeeee;
  --c-set-head:#616161;
  --c-card-done-bg:#eeeeee;--c-card-done-border:#757575;
  --c-card-hover:#f5f5f5;--c-card-hover-border:#bdbdbd;
  --c-divider:#eeeeee;--c-divider-text:#616161;--c-divider-alt:#9e9e9e;
  --c-set-head-jp:#424242;
}
/* Apply page-wide variables */
body{background:var(--c-body-bg);}
.header{background:linear-gradient(135deg,var(--c-accent1) 0%,var(--c-accent2) 60%,var(--c-accent3) 100%);}
.poke-bar{background:var(--c-poke-bar);border-bottom-color:var(--c-poke-bar-border);}
.era-label{color:var(--c-era);}
.set-head.c-green{background:var(--c-set-head);}
.card:hover{background:var(--c-card-hover);border-color:var(--c-card-hover-border);}
.card.done{background:var(--c-card-done-bg);border-color:var(--c-card-done-border);}
.poke-divider{color:var(--c-divider-text);border-top-color:var(--c-divider);}
.poke-divider-names-alt{color:var(--c-divider-alt);}
.poke-sug-item:hover{background:var(--c-era-bg);}
/* placeholder card colours */
.custom-placeholder{background:linear-gradient(160deg,var(--ph-bg1) 0%,var(--ph-bg2) 50%,var(--ph-bg1) 100%)!important;border-color:var(--ph-border)!important;}
.custom-placeholder::before{border-color:var(--ph-inner)!important;}
.cp-name{color:var(--ph-name)!important;}
.cp-native{color:var(--ph-native)!important;}
.cp-set{color:var(--ph-set)!important;}
.cp-num{color:var(--ph-num)!important;}
/* Palette toolbar in header */
.palette-bar{display:flex;align-items:center;gap:4px;}
.palette-label{font-size:9px;color:rgba(255,255,255,.7);white-space:nowrap;}
.palette-btn{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;flex-shrink:0;transition:transform .1s,border-color .1s;}
.palette-btn:hover{transform:scale(1.25);}
.palette-btn.active{border-color:white;box-shadow:0 0 0 1px rgba(255,255,255,.5);}
@media print{.palette-bar{display:none!important;}}

/* ── HEADER ── */
.header{background:linear-gradient(135deg,var(--c-accent1) 0%,var(--c-accent2) 60%,var(--c-accent3) 100%);color:white;padding:8px 14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;box-shadow:0 4px 16px rgba(0,0,0,.35);border-radius:12px 12px 0 0;}
.header h1{font-size:12px;flex:1;min-width:120px;}
.stats{font-size:11px;background:rgba(0,0,0,.25);padding:3px 9px;border-radius:20px;white-space:nowrap;}
.btn{padding:4px 10px;border:1.5px solid rgba(255,255,255,.7);border-radius:5px;background:transparent;color:white;cursor:pointer;font-size:10px;font-weight:bold;white-space:nowrap;}
.btn:hover{background:rgba(255,255,255,.18);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-secondary{border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.85);font-weight:normal;}
.btn-print-sel{background:rgba(255,255,255,.15);}
@media print{.header{display:none!important;}}

/* ── POKÉMON SELECTOR BAR ── */
.poke-bar{background:var(--c-poke-bar,#1b5e20);border-top:1px solid rgba(255,255,255,.1);padding:6px 14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.filter-bar{background:#fff;border-top:1px solid #d7e8d7;padding:6px 14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;border-radius:0 0 12px 12px;box-shadow:0 4px 16px rgba(0,0,0,.18);}.sticky-top{position:sticky;top:8px;z-index:20;max-width:1100px;margin:0 auto;padding:0 12px;}
.poke-bar-label{font-size:10px;font-weight:bold;color:rgba(255,255,255,.8);white-space:nowrap;}
.poke-chips{display:flex;flex-wrap:wrap;gap:4px;flex:1;}
.poke-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:white;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:bold;}
.poke-chip-remove{background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-size:13px;line-height:1;padding:0 0 0 2px;}
.poke-chip-remove:hover{color:white;}
.poke-input-wrap{display:flex;gap:5px;}
.poke-input{padding:3px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:white;font-size:10px;width:130px;outline:none;}
.poke-input::placeholder{color:rgba(255,255,255,.5);}
.poke-input:focus{border-color:rgba(255,255,255,.8);background:rgba(255,255,255,.18);}
.poke-add-btn{padding:3px 9px;border-radius:4px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:white;font-size:10px;cursor:pointer;white-space:nowrap;}
.poke-add-btn:hover{background:rgba(255,255,255,.25);}
.poke-suggestions{position:absolute;top:100%;left:0;background:white;border:1px solid #ccc;border-radius:4px;max-height:160px;overflow-y:auto;z-index:100;min-width:180px;box-shadow:0 4px 12px rgba(0,0,0,.15);display:none;}
.poke-suggestions.open{display:block;}
.poke-sug-item{padding:5px 10px;font-size:10px;cursor:pointer;color:#1a1a1a;}
.poke-sug-item:hover{background:#e8f5e9;}
.poke-input-container{position:relative;}
@media print{.poke-bar{display:none!important;}}

/* ── FILTER BAR ── */

.filter-label{font-size:10px;font-weight:bold;color:#555;white-space:nowrap;}
.filter-pills{display:flex;flex-wrap:wrap;gap:4px;flex:1;}
.filter-pill{font-size:10px;font-weight:bold;padding:2px 8px;border-radius:20px;border:1.5px solid transparent;cursor:pointer;color:white;opacity:.38;transition:opacity .12s,transform .08s;user-select:none;}
.filter-pill:hover{opacity:.7;transform:scale(1.05);}
.filter-pill.active{opacity:1;border-color:rgba(0,0,0,.2);transform:scale(1.05);}
.filter-clear{font-size:10px;padding:2px 9px;border:1px solid #ccc;border-radius:20px;background:white;color:#555;cursor:pointer;white-space:nowrap;}
.filter-clear:hover{background:#f5f5f5;}
.card.lang-hidden{display:none!important;}
.set-block.all-hidden{display:none!important;}
.era-label.era-hidden{display:none!important;}
@media print{.filter-bar{display:none!important;}}

/* ── MAIN ── */
body{padding-top:8px;}main{max-width:1100px;margin:0 auto;padding:12px;}
.era-label{font-size:10px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;color:var(--c-era,#555);margin:14px 0 4px 2px;}

/* ── BANNERS ── */
.banner{border-radius:6px;padding:7px 12px;margin-bottom:8px;font-size:10px;line-height:1.5;display:flex;align-items:flex-start;gap:8px;}
.banner-body{flex:1;}
.banner-close{background:none;border:none;cursor:pointer;font-size:14px;line-height:1;opacity:.6;flex-shrink:0;padding:0;}
.banner-close:hover{opacity:1;}
.banner-blue{background:#e8f4fd;border:1px solid #90caf9;color:#0d47a1;}
.banner-amber{background:#fff8e1;border:1px solid #ffe082;color:#e65100;}
.banner-load{background:#f3e5f5;border:1px solid #ce93d8;color:#4a148c;animation:pulse 1.5s infinite;}
.banner-green{background:#e8f5e9;border:1px solid #a5d6a7;color:#1b5e20;}
.banner-error{background:#fce4ec;border:1px solid #f48fb1;color:#880e4f;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@media print{.banner{display:none!important;}}

/* ── SET BLOCK ── */
.set-block{background:white;border-radius:8px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.12);}
.set-head{color:white;padding:5px 12px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
.set-head.c-green{background:var(--c-set-head,#2e7d32);}.set-head.c-blue{background:#1565c0;}.set-head.c-brown{background:#4e342e;}.set-head.c-orange{background:var(--c-set-head-jp,#bf360c);}
.set-head-left{display:flex;align-items:center;gap:8px;min-width:0;}
.set-symbol{width:24px;height:24px;object-fit:contain;flex-shrink:0;filter:brightness(0) invert(1);opacity:.9;}
.set-name-block{display:flex;flex-direction:column;min-width:0;}
.set-name-en{font-size:11px;font-weight:bold;white-space:normal;overflow:hidden;word-break:break-word;}
.set-head-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.set-count{font-size:10px;opacity:.75;}
.set-select-btn{font-size:9px;font-weight:bold;padding:2px 7px;border-radius:3px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:white;cursor:pointer;white-space:nowrap;}
.set-select-btn:hover{background:rgba(255,255,255,.25);}
@media print{.set-select-btn{display:none!important;}}

/* ── CARD GRID — 3 to 9 cards per row depending on viewport ── */
.cards-grid{
  display:grid;
  /* Cards are min 90px, grow to fill. auto-fill means as many columns as fit.
     At 1100px wide (~main max-width): ~10-11 cards. At 400px: ~4 cards. */
  grid-template-columns:repeat(auto-fill,minmax(min(90px,100%),1fr));
  gap:6px;padding:6px 8px;
}

/* Pokémon name divider inside a set block */
.poke-divider{
  grid-column: 1 / -1;
  padding: 5px 2px 2px;
  font-size: 10px; font-weight: bold; color: var(--c-divider-text,#2e7d32);
  border-top: 1px solid var(--c-divider,#e8f5e9);
}
.poke-divider:first-child { border-top: none; padding-top: 2px; }
.poke-divider-names-alt { font-weight: normal; color: var(--c-divider-alt,#81c784); }

/* ── CARD — consistent size, no overflow ── */
.card{
  border:2px solid #e0e0e0;border-radius:7px;padding:4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;background:#fafafa;
  transition:background .1s,border-color .1s,transform .08s;
  user-select:none;overflow:hidden;
  /* consistent width — let grid control it */
  min-width:0;
}
.card:hover{background:var(--c-card-hover,#f0f8f0);border-color:var(--c-card-hover-border,#81c784);transform:translateY(-1px);}
.card.done{background:var(--c-card-done-bg,#e8f5e9);border-color:var(--c-card-done-border,#43a047);}
.card.cameo{border:2px solid #c8a400;}
.card.cameo.done{background:#e8f5e9;border-color:#43a047;}

.img-wrap{width:100%;display:flex;justify-content:center;overflow:hidden;}
/* Card image fills the cell width, maintains card aspect ratio */
.card-img{
  width:100%;height:auto;
  aspect-ratio:63.5/88.9;
  border-radius:5px;display:block;
  object-fit:cover;
}

/* ── CUSTOM PLACEHOLDER (missing image) — fills grid cell like a real card ── */
.custom-placeholder{
  width:100%;
  aspect-ratio:63.5/88.9;
  border-radius:6px;
  background:linear-gradient(160deg,#1a3a2a 0%,#2d5a3d 50%,#1a3a2a 100%);
  border:2px solid #c8a400;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:5px 3px;text-align:center;position:relative;overflow:hidden;
}
.custom-placeholder::before{content:'';position:absolute;inset:2px;border-radius:4px;border:1px solid rgba(200,164,0,.35);pointer-events:none;}
.cp-symbol{width:20px;height:20px;object-fit:contain;opacity:.5;filter:brightness(0) invert(1);margin-bottom:1px;}
.cp-lang{font-size:7px;font-weight:bold;color:white;padding:1px 4px;border-radius:2px;}
.cp-name{font-size:8px;font-weight:bold;color:#ffd54f;line-height:1.2;word-break:break-word;text-shadow:0 1px 2px rgba(0,0,0,.5);}
.cp-native{font-size:8px;font-weight:bold;color:#ffe082;line-height:1.2;word-break:break-word;}
.cp-set{font-size:7px;color:#a5d6a7;line-height:1.2;word-break:break-word;}
.cp-num{font-size:6.5px;color:#81c784;font-style:italic;}
.cp-note{font-size:6px;color:rgba(255,255,255,.4);margin-top:1px;line-height:1.2;}
.img-retry-btn{margin-top:3px;padding:2px 5px;font-size:6.5px;border:1px solid rgba(200,164,0,.5);border-radius:3px;background:rgba(0,0,0,.2);color:#a5d6a7;cursor:pointer;}
.img-retry-btn:hover{background:rgba(0,0,0,.35);}
@media print{.img-retry-btn{display:none!important;}}

/* ── CARD FOOTER ── */
.card-footer{width:100%;display:flex;align-items:center;justify-content:space-between;}
.card-num{font-size:9px;color:#666;}
.lang{font-size:7.5px;font-weight:bold;padding:1px 4px;border-radius:3px;color:white;}
.lang-EN{background:#1565c0;}.lang-DE{background:#5b4000;}.lang-FR{background:#1a237e;}
.lang-ES{background:#b71c1c;}.lang-IT{background:#1b5e20;}.lang-PT{background:#880e4f;}
.lang-JP{background:#4527a0;}.lang-TW{background:#c62828;}.lang-TH{background:#283593;}
.lang-ID{background:#e65100;}.lang-KR{background:#00695c;}.lang-SC{background:#4a148c;}
.chk{width:14px;height:14px;cursor:pointer;accent-color:#2e7d32;flex-shrink:0;}

/* ── PREVIEW MODAL ── */
.preview-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.8);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;padding:16px;
}
.preview-overlay.open{display:flex;}
.preview-box{
  background:#1a2a1a;border-radius:12px;
  width:min(88vw,calc(80vh * 63.5 / 88.9));
  max-width:500px;
  position:relative;box-shadow:0 12px 60px rgba(0,0,0,.7);
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:36px 12px 14px; /* top padding leaves room for × button */
}
/* preview-content must fill box width so both img and placeholder are equal size */
#preview-content{width:100%;}
.preview-img{
  width:100%;display:block;
  border-radius:8px;
  aspect-ratio:63.5/88.9;object-fit:cover;
}
/* preview placeholder — scale all text elements to fill the larger card */
.preview-placeholder .custom-placeholder{
  width:100%!important;max-width:none!important;
  border-radius:8px;gap:6px;padding:16px 10px;
}
.preview-placeholder .cp-symbol{width:clamp(32px,6vw,52px)!important;height:clamp(32px,6vw,52px)!important;margin-bottom:4px;}
.preview-placeholder .cp-lang{font-size:clamp(12px,2.5vw,18px)!important;padding:3px 12px!important;}
.preview-placeholder .cp-name{font-size:clamp(20px,4.5vw,36px)!important;}
.preview-placeholder .cp-native{font-size:clamp(16px,3.5vw,28px)!important;}
.preview-placeholder .cp-set{font-size:clamp(12px,2.5vw,18px)!important;}
.preview-placeholder .cp-num{font-size:clamp(10px,2vw,15px)!important;}
@media(max-width:500px){
  .preview-box{width:min(94vw,calc(75vh * 63.5 / 88.9));}
}
.preview-meta{color:#a5d6a7;font-size:11px;text-align:center;line-height:1.6;}
.preview-close{
  position:absolute;top:8px;right:10px;background:none;border:none;
  color:rgba(255,255,255,.6);font-size:22px;cursor:pointer;line-height:1;
}
.preview-close:hover{color:white;}
.preview-btn{
  font-size:7px;padding:1px 4px;border:1px solid rgba(200,164,0,.5);
  border-radius:3px;background:rgba(0,0,0,.2);color:#a5d6a7;
  cursor:pointer;margin-top:2px;
}
.preview-btn:hover{background:rgba(0,0,0,.35);}

/* ── MOBILE ── */
@media(max-width:600px){
  .header h1{font-size:11px;}
  .btn{padding:3px 7px;font-size:9px;}
  .stats{font-size:10px;}
  .poke-bar{top:36px;}
  .filter-bar{top:76px;}
  .cards-grid{grid-template-columns:repeat(auto-fill,minmax(min(80px,100%),1fr));gap:4px;padding:5px;}
  .card{padding:3px;gap:2px;}
  .set-name-en{font-size:10px;}
  main{padding:6px;}
}
@media(max-width:380px){
  .cards-grid{grid-template-columns:repeat(auto-fill,minmax(min(70px,100%),1fr));gap:3px;}
}

/* ── PRINT CHECKLIST ── */
@media print{
  body{background:white!important;}
  main{padding:0!important;max-width:100%!important;}
  .era-label{margin:6px 0 2px 1px;font-size:8px;}
  .set-block{box-shadow:none!important;margin-bottom:5px!important;border:1px solid #ccc!important;break-inside:avoid;}
  .set-head{padding:3px 8px!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}

/* ── MODE TOGGLE ── */
.mode-toggle{display:flex;gap:0;border-radius:6px;overflow:hidden;border:1.5px solid rgba(255,255,255,.45);flex-shrink:0;}
.mode-btn{padding:4px 11px;font-size:10px;font-weight:bold;background:transparent;color:rgba(255,255,255,.65);border:none;cursor:pointer;transition:background .12s,color .12s;white-space:nowrap;}

#tms-app{display:none;max-width:1100px;margin:0 auto;padding:12px;}
.tms-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center;}

/* TMS Pokémon grid */

.tms-poke-tile:hover{border-color:var(--c-card-hover-border,#81c784);background:var(--c-card-hover,#f0f8f0);transform:translateY(-1px);}

'use strict';

// =============================================================================
// POKÉMON TCG MASTER SET CHECKLIST
// =============================================================================
//
// Architecture:
//   Data sources:
//     - Bulbapedia (MediaWiki API, CORS OK) → card lists for EN + JP
//     - pokemontcg.io (REST API, CORS OK)   → EN card metadata, images, set dates
//     - Limitless TPCI CDN (/tpci/)         → EN/DE/FR/ES/IT/PT card images
//     - Limitless TPC CDN  (/tpc/)          → JP card images (via JP_BULBA_SET_MAP)
//     - TCGdex CDN (assets.tcgdex.net)      → Non-EN fallback images (partial coverage)
//
//   Image priority chain:
//     EN:           Limitless TPCI → pokemontcg.io PNG → TCGdex → placeholder
//     DE/FR/ES/IT/PT: Limitless TPCI → TCGdex → placeholder
//     JP:           Limitless TPC (via Bulbapedia card numbers) → placeholder
//     TW/TH/ID:     TCGdex → placeholder
//     KR/SC:        placeholder only (no public image source)
//
//   Cache:          localStorage, 24h TTL, key = CACHESTORE
//   JP data:        _bulbaData (in-memory, reset on Pokémon list change)
//
// =============================================================================

// ── IMAGE ERROR LOGGING ───────────────────────────────────────────────────────
// Log every failed image load with its URL so ORB errors are traceable

    console.warn('[IMG FAIL]', e.target.src);
  }
}, true);

  { code:'zh-Hant', apiCode:'zh-tw', badge:'TW', color:'#c62828', label:'Traditional Chinese (TW/HK)', hasSetsApi:true  },

  sm:'Sun & Moon Era', xy:'XY Era', bw:'Black & White Era',

const LIMITLESS_LANG_CODE = {
  EN:'EN', DE:'DE', FR:'FR', ES:'ES', IT:'IT', PT:'PT',
};

function limitlessIntlUrl(ptcgoCode, num, langBadge){
  const langCode = LIMITLESS_LANG_CODE[langBadge];
  if(!ptcgoCode || !langCode) return null;
  const n = String(parseInt(num,10)).padStart(3,'0');
  if(!n || n==='NaN') return null;
  return `https://limitlesstcg.nyc3.cdn.digitaloceanspaces.com/tpci/${ptcgoCode}/${ptcgoCode}_${n}_R_${langCode}.png`;

};

function ptcgioToTcgdexSetId(setId){
  const svM = setId.match(/^sv(\d+)(.*)/);
  if(svM) return `sv${svM[1].padStart(2,'0')}${svM[2]}`;
  const meM = setId.match(/^(me)(\d+)/);
  if(meM) return `me${meM[2].padStart(2,'0')}`;
  return setId; // bw4, swsh11, xy9, etc. — already match

function ptcgioToTcgdexLocalId(num, series){

// Sort order: true = newest first (default), false = oldest first

function saveChk()       { try{ localStorage.setItem(CHKSTORE,    JSON.stringify([...checked]));       }catch(e){} }
function savePoke()      { try{ localStorage.setItem(POKESTORE,   JSON.stringify(pokemonList));         }catch(e){} }

const _meta    = new Map();
const setBlockNamesMap = new Map();
let totalCards = 0;

function visibleCards(){
  return [...document.querySelectorAll('.card[data-id]')].filter(c=>!c.classList.contains('lang-hidden'));
}

function updateStats(){
  const vis = visibleCards();
  const visChecked = vis.filter(c=>c.classList.contains('done')).length;
  document.getElementById('stats').textContent=`${visChecked} / ${vis.length} collected`;
  const b=document.getElementById('btn-print-sel'); if(b) b.textContent=`📄 Print Selected (${checked.size})`;
}
function resetAll(){
  if(!confirm('Reset all checkboxes?')) return;
  checked.clear(); saveChk();
  document.querySelectorAll('.card').forEach(e=>e.classList.remove('done'));
  document.querySelectorAll('.chk').forEach(e=>e.checked=false);
  updateStats();
}

// ── SORT ORDER ────────────────────────────────────────────────────────────────
function updateSortBtn(){
  const btn=document.getElementById('btn-sort'); if(!btn) return;
  btn.textContent = sortDesc ? '↓ Newest first' : '↑ Oldest first';
  btn.title = sortDesc ? 'Currently: newest sets first. Click to reverse.' : 'Currently: oldest sets first. Click to reverse.';
}
function toggleSort(){
  sortDesc = !sortDesc;
  try{localStorage.setItem(SORTSTORE, sortDesc ? 'desc' : 'asc');}catch(e){}
  updateSortBtn();
  // Re-render from cache — no network request needed
  const cached = loadCache();
  if(cached && cached.cards){
    const container = document.getElementById('dyn');
    // Save keyed (persistent) banners; let renderBySet re-create them if needed
    // mkBanner will skip any banner whose key already exists in the DOM
    const persistBanners = [...container.querySelectorAll('.banner[data-key]')];
    container.innerHTML = '';
    persistBanners.forEach(b => container.appendChild(b));
    setBlockNamesMap.clear(); totalCards = 0;
    renderBySet(cached.cards, cached.setNamesAll||{}, container);
    fetchAndInjectJPCards(container).catch(e=>console.warn('JP sort re-inject failed:',e.message));
    buildPills(); updateStats();
  }
}

const PALETTE_KEY = 'tcgPalette_v1';
function setPalette(btn, cls){
  const all = ['palette-ocean','palette-dusk','palette-fire','palette-mono'];
  document.body.classList.remove(...all);
  if(cls) document.body.classList.add(cls);
  document.querySelectorAll('.palette-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  try{localStorage.setItem(PALETTE_KEY,cls);}catch(e){}
}
(function restorePalette(){
  try{
    const saved=localStorage.getItem(PALETTE_KEY)||'';
    if(saved) document.body.classList.add(saved);
    const btn=document.querySelector(`.palette-btn[data-palette="${saved}"]`);
    if(btn){document.querySelectorAll('.palette-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
  }catch(e){}
})();

// ── TOGGLE ────────────────────────────────────────────────────────────────────
function attachToggle(el,id){
  const chk=el.querySelector('.chk');
  el.addEventListener('click',e=>{
    // Don't toggle if clicking preview btn or checkbox
    if(e.target.classList.contains('preview-btn')||e.target.classList.contains('chk')) return;
    const n=!chk.checked; chk.checked=n;
    if(n){checked.add(id);el.classList.add('done');}else{checked.delete(id);el.classList.remove('done');}
    saveChk(); updateStats();
  });
  chk.addEventListener('change',e=>{
    if(e.target.checked){checked.add(id);el.classList.add('done');}else{checked.delete(id);el.classList.remove('done');}
    saveChk(); updateStats();
  });
  // Preview button
  el.querySelector('.preview-btn')?.addEventListener('click',e=>{ e.stopPropagation(); openPreview(id); });
}

// ── SELECT ALL / SET ──────────────────────────────────────────────────────────
function selectSet(block){
  // Only affect visible (not lang-hidden) cards in this block
  const cards=[...block.querySelectorAll('.card[data-id]')].filter(c=>!c.classList.contains('lang-hidden'));
  const any=cards.some(c=>!c.classList.contains('done'));
  cards.forEach(c=>{
    const id=c.dataset.id; if(!id) return;
    const chk=c.querySelector('.chk');
    if(any){checked.add(id);c.classList.add('done');if(chk)chk.checked=true;}
    else{checked.delete(id);c.classList.remove('done');if(chk)chk.checked=false;}
  });
  saveChk(); updateStats();
}
function selectAll(){
  // Only affect visible (not lang-hidden) cards
  const all=visibleCards();
  const any=all.some(c=>!c.classList.contains('done'));
  all.forEach(c=>{
    const id=c.dataset.id; const chk=c.querySelector('.chk');
    if(any){checked.add(id);c.classList.add('done');if(chk)chk.checked=true;}
    else{checked.delete(id);c.classList.remove('done');if(chk)chk.checked=false;}
  });
  saveChk(); updateStats();
  const btn=document.getElementById('btn-select-all'); if(btn) btn.textContent=any?'☐ Deselect All':'☑ Select All';
}

// ── POKÉMON SELECTOR UI ───────────────────────────────────────────────────────
function renderPokeChips(){
  const t=document.getElementById('page-title');
  if(appMode==='tms'){
    if(t) t.textContent=`⭐ True Master Set Checklist`;
    return;
  }
  const c=document.getElementById('poke-chips'); if(!c) return; c.innerHTML='';
  pokemonList.forEach(name=>{
    const chip=document.createElement('span'); chip.className='poke-chip';
    chip.innerHTML=`${name}<button class="poke-chip-remove" title="Remove ${name}">×</button>`;
    chip.querySelector('button').addEventListener('click',()=>removePoke(name));
    c.appendChild(chip);
  });
  // Update page title
  if(t) t.textContent=`🌿 ${pokemonList.join(' · ')} — Master Set Checklist`;
}

function addPokeFromInput(){
  const inp=document.getElementById('poke-input'); if(!inp) return;
  const name=inp.value.trim();
  if(!name){return;}
  addPoke(name);
  inp.value=''; hideSuggestions();
}

function addPoke(name){
  const normalized=name.charAt(0).toUpperCase()+name.slice(1).toLowerCase();
  if(!pokemonList.includes(normalized)){
    pokemonList.push(normalized); savePoke(); renderPokeChips();
    // Clear both localStorage cache AND in-memory Bulbapedia cache
    try{localStorage.removeItem(CACHESTORE);}catch(e){}
    _bulbaData = null;
    buildAll(false);
  }
}

function removePoke(name){
  if(pokemonList.length<=1){ alert('You need at least one Pokémon.'); return; }
  pokemonList=pokemonList.filter(p=>p!==name); savePoke(); renderPokeChips();
  try{localStorage.removeItem(CACHESTORE);}catch(e){}
  _bulbaData = null;
  buildAll(false);
}

function onPokeKey(e){
  if(e.key==='Enter'){addPokeFromInput();}
  else if(e.key==='Escape'){hideSuggestions();}
}

function onPokeInput(val){
  if(!val.trim()){hideSuggestions();return;}
  const q=val.toLowerCase();
  const matches=POKEMON_CATALOG.map(p=>p.name).filter(p=>p.toLowerCase().startsWith(q)&&!pokemonList.includes(p)).slice(0,8);
  const sug=document.getElementById('poke-suggestions'); if(!sug) return;
  if(!matches.length){hideSuggestions();return;}
  sug.innerHTML=''; sug.classList.add('open');
  matches.forEach(m=>{
    const item=document.createElement('div'); item.className='poke-sug-item'; item.textContent=m;
    item.addEventListener('click',()=>{addPoke(m);document.getElementById('poke-input').value='';hideSuggestions();});
    sug.appendChild(item);
  });
}

function hideSuggestions(){
  const s=document.getElementById('poke-suggestions'); if(s) s.classList.remove('open');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.poke-input-container')) hideSuggestions();
});

function mkEra(parent,text,series){

// mkBanner: optional dismissKey saves dismissal to localStorage
// Also skips creation if a banner with the same key already exists in the DOM.
function mkBanner(parent,html,cls,dismissKey){
  if(dismissKey && dismissedBanners.has(dismissKey)) return null;
  if(dismissKey && document.querySelector(`.banner[data-key="${dismissKey}"]`)) return null;
  const e=document.createElement('div'); e.className=`banner ${cls}`;
  if(dismissKey) e.dataset.key=dismissKey;
  const body=document.createElement('div'); body.className='banner-body'; body.innerHTML=html;
  e.appendChild(body);
  if(dismissKey){
    const x=document.createElement('button'); x.className='banner-close'; x.textContent='×'; x.title='Dismiss';
    x.addEventListener('click',()=>{ dismissedBanners.add(dismissKey); saveDismissed(); e.remove(); });
    e.appendChild(x);
  }
  parent.appendChild(e); return e;
}

function mkSetBlock(nameHtml,symSrc,headClass,parent){

  parent.appendChild(block);

  return block;

function updCount(block,n){ const e=block.querySelector('.set-count'); if(e) e.textContent=`${n} ${n===1?'entry':'entries'}`; }

// ── IMAGE WRAP ────────────────────────────────────────────────────────────────
// Priority chain per language:
//   EN:     pokemontcg.io PNG  → TCGdex CDN (fallbackSrc) → placeholder
//   Non-EN: TCGdex CDN (loSrc) → placeholder
//   JP:     handled separately in fetchAndInjectJPCards
//
// fallbackSrc: optional secondary URL tried when loSrc fails (used for EN TCGdex fallback)
function mkImgWrap(loSrc,hiSrc,cardName,localId,enSetName,symSrc,badge,bColor,cardId,fallbackSrc=null){
  const wrap=document.createElement('div'); wrap.className='img-wrap';

  function showPh(){
    const nat=(NATIVE_NAMES[badge]||{})[cardName]||null;
    wrap.innerHTML=buildPlaceholderHTML(symSrc,badge,bColor,cardName,nat,enSetName,localId,true);
    wrap.querySelector('.img-retry-btn')?.addEventListener('click',e=>{e.stopPropagation();tryPrimary();});
  }

  function tryFallback(){
    // TCGdex CDN fallback (used when primary pokemontcg.io image fails for EN)
    if(!fallbackSrc){ showPh(); return; }
    wrap.innerHTML='';
    const fb=document.createElement('img');
    fb.className='card-img'; fb.loading='lazy'; fb.alt=`${cardName} #${localId} ${badge}`;
    fb.src=fallbackSrc;
    fb.onload=()=>{ const m=_meta.get(cardId); if(m){ m.isCustom=false; m.imgSrc=fallbackSrc; } };
    fb.onerror=()=>{ fb.remove(); showPh(); };
    wrap.appendChild(fb);
  }

  function tryPrimary(){
    wrap.className='img-wrap'; wrap.innerHTML='';
    if(!loSrc){ showPh(); return; }
    const img=document.createElement('img');
    img.className='card-img'; img.loading='lazy';
    img.alt=`${cardName} #${localId} ${badge}`; img.src=loSrc;
    img.onload=()=>{ const m=_meta.get(cardId); if(m) m.isCustom=false; };
    img.onerror=()=>{ img.remove(); tryFallback(); };
    wrap.appendChild(img);
  }

  tryPrimary(); return wrap;
}

function buildPlaceholderHTML(symSrc,badge,bColor,cardName,nativeName,setName,localId,showRetry){
  const sym=symSrc?`<img class="cp-symbol" src="${symSrc}" alt="" onerror="this.style.display='none'">`:'' ;
  const nat=nativeName?`<span class="cp-native">${nativeName}</span>`:'';
  const retry=showRetry?`<button class="img-retry-btn">↺ retry</button>`:'';
  return `<div class="custom-placeholder">${sym}<span class="cp-lang" style="background:${bColor}">${badge}</span><span class="cp-name">${cardName}</span>${nat}<span class="cp-set">${setName}</span><span class="cp-num">#${localId}</span>${retry}</div>`;
}

// ── BUILD SETS MAP ────────────────────────────────────────────────────────────
// Handles both pokemontcg.io cards (primary) and TCGdex cards (fallback).
// pokemontcg.io card structure: { id, name, number, set:{id,name,series,releaseDate,images}, images:{small,large} }
// TCGdex card structure:        { id, name, image:"https://assets.tcgdex.net/en/..." }
function isPtcgioCard(card){ return !!card.set?.id; }

function buildSetsMap(enCards, setNamesAll){
  const map = new Map();
  for(const card of enCards){
    let ptcgioSetId, series, tcgdexSetId, localId, tcgdexLocalId,
        enName, releaseDate, symSrc, enImgSrc, enHiImgSrc;

    let era; // used for ERA_MAP display grouping (separate from TCGdex CDN series)
    if(isPtcgioCard(card)){
      // ── pokemontcg.io path ──
      ptcgioSetId  = card.set.id;                         // "swsh11", "sv5", "me1"
      // series = TCGdex CDN prefix, always derived from set ID (e.g. "me" not "xy" for me1)
      series       = ptcgioSetId.replace(/\d.*$/,'');     // "swsh","sv","me","bw","xy"...
      // era = display grouping, uses pokemontcg.io series name for consistent era labels
      era          = PTCGIO_SERIES_ERA[card.set.series] || series;
      tcgdexSetId  = ptcgioToTcgdexSetId(ptcgioSetId);   // "swsh11","sv05","me01"...
      localId      = card.number || '';                   // "13", "003", "XY23"
      tcgdexLocalId= ptcgioToTcgdexLocalId(localId, series);
      enName       = card.set.name;
      releaseDate  = RELEASE_DATE_OVERRIDES[card.set.id] || card.set.releaseDate || '1999/01/01';
      symSrc       = card.set.images?.symbol ||
                     `https://images.pokemontcg.io/${ptcgioSetId}/symbol.png`;
      enImgSrc     = card.images?.small  || null;
      enHiImgSrc   = card.images?.large  || null;
    } else {
      // ── TCGdex fallback path ──
      if(!card.image) continue;
      const stripped = card.image.replace(/^https?:\/\/assets\.tcgdex\.net\/[^/]+\//, '');
      const parts = stripped.split('/').filter(Boolean);
      if(parts.length < 2) continue;
      series       = parts[0];
      era          = PTCGIO_SERIES_ERA[series] || series;
      tcgdexSetId  = ptcgioSetId = parts[1];
      localId      = tcgdexLocalId = parts[2] || '';
      releaseDate  = '1999/01/01';
      enName       = (setNamesAll['en']||{})[tcgdexSetId] || tcgdexSetId;
      symSrc       = `https://assets.tcgdex.net/univ/${series}/${tcgdexSetId}/symbol.webp`;
      enImgSrc     = `${card.image}/low.webp`;
      enHiImgSrc   = `${card.image}/high.webp`;
    }

    if(!map.has(ptcgioSetId)){
      const namesByBadge = {};
      for(const lang of LANGUAGES){
        namesByBadge[lang.badge] = (setNamesAll[lang.code]||{})[tcgdexSetId] || enName;
      }
      for(const pl of PLACEHOLDER_LANGS) namesByBadge[pl.badge] = enName;
      namesByBadge['JP'] = enName;
      const allUnique = [...new Set(Object.values(namesByBadge))];
      map.set(ptcgioSetId,{
        setId:ptcgioSetId, tcgdexSetId, series, era, enName, releaseDate,
        combined: allUnique.join(' | '), namesByBadge, symSrc, cards:[]
      });
    }
    map.get(ptcgioSetId).cards.push({
      localId, tcgdexLocalId, series,
      setId:ptcgioSetId, tcgdexSetId,
      name:card.name, id:card.id,
      enImgSrc, enHiImgSrc,
      ptcgoCode: card.ptcgoCode||null,
    });
  }
  return map;
}

// Extract a sortable numeric key from a set ID so sets within an era sort correctly.
// e.g. "swsh11" → 11, "sv05" → 5, "sv5M" → 5.13, "xyp" → 0
function setOrder(setId){
  const m = setId.match(/(\d+)([a-zA-Z]*)/);
  if(!m) return 0;
  const base = parseInt(m[1], 10);
  const sub  = m[2]
    ? m[2].toLowerCase().split('').reduce((a,ch,i)=>a+(ch.charCodeAt(0)-96)/(100**(i+1)),0)
    : 0;
  return base + sub;
}

// ── RENDER ALL (set-first) ────────────────────────────────────────────────────
function renderBySet(enCards, setNamesAll, container){
  if(!enCards.length) return;

  const setsMap=buildSetsMap(enCards,setNamesAll);
  // Group by ERA for display — use si.era so that e.g. "me" sets appear under XY Era
  const bySeries=new Map();
  setsMap.forEach(si=>{
    const key=si.era||si.series;
    if(!bySeries.has(key)) bySeries.set(key,[]);
    bySeries.get(key).push(si);
  });

  // Placeholder lang banners (dismissible)
  for(const pl of PLACEHOLDER_LANGS){
    const links=pl.sources.map(s=>`<a href="${s.url}" target="_blank" style="color:inherit;font-weight:bold">${s.name}</a>`).join(' · ');
    mkBanner(container,`<strong>${pl.label} (${pl.badge})</strong>: ${pl.note} — ${links}`,'banner-amber',`plang-${pl.badge}`);
  }

  // Sort eras and sets by actual release date from pokemontcg.io
  function relDate(si){ return new Date(si.releaseDate||'1999/01/01').getTime(); }

  const eraEntries = [...bySeries.entries()].sort((a,b)=>{
    const aDate = Math.min(...a[1].map(relDate));
    const bDate = Math.min(...b[1].map(relDate));
    return sortDesc ? bDate - aDate : aDate - bDate;
  });

  eraEntries.forEach(([series, sets])=>{
    const sortedSets = [...sets].sort((a,b)=>{
      const diff = relDate(a) - relDate(b);
      return sortDesc ? -diff : diff;
    });

    mkEra(container,ERA_MAP[series]||series||'Other Sets',series);
    sortedSets.forEach(si=>{
      try{
      const block=mkSetBlock(si.combined,si.symSrc,'c-green',container);
      block.dataset.releaseDate=relDate(si); // used by JP sort insertion
      setBlockNamesMap.set(block,{namesByBadge:si.namesByBadge,enName:si.enName});
      const grid=block.querySelector('.cards-grid');
      let count=0;

      // Group cards by Pokémon name (preserving natural order)
      const byPokemon=new Map();
      si.cards.forEach(card=>{
        if(!byPokemon.has(card.name)) byPokemon.set(card.name,[]);
        byPokemon.get(card.name).push(card);
      });

      byPokemon.forEach((cards,pokeName)=>{
        // Pokémon name divider — all names inline
        const altNames=[...new Set([
          NATIVE_NAMES.JP?.[pokeName],
          NATIVE_NAMES.TW?.[pokeName],
          NATIVE_NAMES.KR?.[pokeName],
        ].filter(Boolean))].join(' · ');
        const divider=document.createElement('div');
        divider.className='poke-divider';
        divider.innerHTML=`${pokeName}${altNames?` <span class="poke-divider-names-alt">· ${altNames}</span>`:''}`;
        grid.appendChild(divider);

        cards.forEach(card=>{
          // TCGdex languages
          for(const langDef of LANGUAGES){
            const id=`${langDef.badge}_${card.id}`, isDone=checked.has(id);
            // All languages: Limitless TPCI CDN primary → fallback → placeholder
            // EN fallback: pokemontcg.io PNG; non-EN fallback: TCGdex CDN
            let loSrc, hiSrc, fallbackSrc;
            const limitlessSrc = limitlessIntlUrl(card.ptcgoCode, card.localId, langDef.badge);
            if(langDef.badge==='EN'){
              loSrc = limitlessSrc || card.enImgSrc;
              hiSrc = limitlessSrc || card.enHiImgSrc || card.enImgSrc;
              fallbackSrc = limitlessSrc ? (card.enImgSrc||null) : `https://assets.tcgdex.net/en/${card.series}/${card.tcgdexSetId}/${card.tcgdexLocalId}/low.webp`;
            } else {
              const tcgdexBase=`https://assets.tcgdex.net/${langDef.code}/${card.series}/${card.tcgdexSetId}/${card.tcgdexLocalId}`;
              loSrc = limitlessSrc || `${tcgdexBase}/low.webp`;
              hiSrc = limitlessSrc || `${tcgdexBase}/high.webp`;
              fallbackSrc = limitlessSrc ? `${tcgdexBase}/low.webp` : null;
            }
            _meta.set(id,{name:{en:card.name,native:(NATIVE_NAMES[langDef.badge]||{})[card.name]||null},setName:si.enName,num:`#${card.localId}`,lang:langDef.badge,langColor:langDef.color,imgSrc:loSrc,hiImgSrc:hiSrc,isCustom:true,symSrc:si.symSrc});
            const el=document.createElement('div');
            el.className='card'+(isDone?' done':''); el.dataset.id=id; el.dataset.lang=langDef.badge;
            // EN: TCGdex fallback; non-EN: TCGdex fallback when Limitless fails
            const enFallback = fallbackSrc;
            const iw=mkImgWrap(loSrc,hiSrc,card.name,card.localId,si.enName,si.symSrc,langDef.badge,langDef.color,id,enFallback);
            const footer=document.createElement('div'); footer.className='card-footer';
            const chk=document.createElement('input'); chk.type='checkbox'; chk.className='chk';
            if(isDone) chk.checked=true; chk.onclick=e=>e.stopPropagation();
            footer.innerHTML=`<span class="card-num">#${card.localId}</span><span class="lang lang-${langDef.badge}">${langDef.badge}</span><button class="preview-btn" title="Preview">🔍</button>`;
            footer.appendChild(chk); el.appendChild(iw); el.appendChild(footer);
            attachToggle(el,id); grid.appendChild(el); count++;
          }
          // Placeholder langs (KR, SC)
          for(const pl of PLACEHOLDER_LANGS){
            const id=`${pl.badge}_${card.id}`, isDone=checked.has(id);
            const nat=(NATIVE_NAMES[pl.badge]||{})[card.name]||null;
            _meta.set(id,{name:{en:card.name,native:nat},setName:si.enName,num:`#${card.localId}`,lang:pl.badge,langColor:pl.color,imgSrc:null,isCustom:true,symSrc:si.symSrc});
            const el=document.createElement('div');
            el.className='card'+(isDone?' done':''); el.dataset.id=id; el.dataset.lang=pl.badge;
            const phWrap=document.createElement('div'); phWrap.className='img-wrap';
            phWrap.innerHTML=buildPlaceholderHTML(si.symSrc,pl.badge,pl.color,card.name,nat,si.enName,card.localId,false);
            const footer=document.createElement('div'); footer.className='card-footer';
            const chk=document.createElement('input'); chk.type='checkbox'; chk.className='chk';
            if(isDone) chk.checked=true; chk.onclick=e=>e.stopPropagation();
            footer.innerHTML=`<span class="card-num">#${card.localId}</span><span class="lang" style="background:${pl.color}">${pl.badge}</span><button class="preview-btn" title="Preview">🔍</button>`;
            footer.appendChild(chk); el.appendChild(phWrap); el.appendChild(footer);
            attachToggle(el,id); grid.appendChild(el); count++;
          }
        });
      });

      totalCards+=count; updCount(block,count);
      }catch(setErr){ console.error('Error rendering set',si.setId,':',setErr); }
    });
  });
  updateStats();
}

// ── LANGUAGE FILTER ───────────────────────────────────────────────────────────
function buildPills(){
  const c=document.getElementById('filter-pills'); if(!c) return; c.innerHTML='';
  const present=new Set([...document.querySelectorAll('.card[data-lang]')].map(x=>x.dataset.lang));
  // Reset activeLangs if empty OR if the saved set has no overlap with cards present
  // (stale localStorage from a previous Pokémon selection, for example)
  const overlap=[...activeLangs].filter(b=>present.has(b));
  if(activeLangs.size===0||overlap.length===0) activeLangs=new Set([...present]);
  const langLabel=badge=>{
    const l=LANGUAGES.find(x=>x.badge===badge)||PLACEHOLDER_LANGS.find(x=>x.badge===badge);
    if(l) return l.label;
    if(badge==='JP') return 'Japanese';
    return badge;
  };
  BADGE_ORDER.filter(b=>present.has(b)).forEach(badge=>{
    const p=document.createElement('button');
    p.className='filter-pill'+(activeLangs.has(badge)?' active':'');
    p.textContent=badge; p.style.background=langColor(badge);
    p.title=langLabel(badge);
    p.addEventListener('click',()=>{
      if(activeLangs.has(badge)){activeLangs.delete(badge);p.classList.remove('active');}
      else{activeLangs.add(badge);p.classList.add('active');}
      saveFilter(); applyFilter();
    });
    c.appendChild(p);
  });
  applyFilter();
}

function toggleAllFilter(){
  const present=new Set([...document.querySelectorAll('.card[data-lang]')].map(x=>x.dataset.lang));
  const allActive=[...present].every(b=>activeLangs.has(b));
  if(allActive){
    activeLangs.clear();
    document.querySelectorAll('.filter-pill').forEach(p=>p.classList.remove('active'));
  } else {
    activeLangs=new Set([...present]);
    document.querySelectorAll('.filter-pill').forEach(p=>p.classList.add('active'));
  }
  saveFilter(); applyFilter();
}

function applyFilter(){
  document.querySelectorAll('.card[data-lang]').forEach(c=>
    c.classList.toggle('lang-hidden',!activeLangs.has(c.dataset.lang)));

  // Hide poke-dividers if every card until the next divider is hidden
  document.querySelectorAll('.poke-divider').forEach(div=>{
    let sib=div.nextElementSibling, allHidden=true;
    while(sib && !sib.classList.contains('poke-divider')){
      if(sib.classList.contains('card') && !sib.classList.contains('lang-hidden')){ allHidden=false; break; }
      sib=sib.nextElementSibling;
    }
    div.style.display=allHidden?'none':'';
  });

  document.querySelectorAll('.set-block').forEach(b=>{
    const cards=b.querySelectorAll('.card[data-lang]');
    b.classList.toggle('all-hidden',cards.length>0&&![...cards].some(c=>!c.classList.contains('lang-hidden')));
  });
  document.querySelectorAll('.era-label').forEach(lbl=>{
    let s=lbl.nextElementSibling,v=false;
    while(s&&!s.classList.contains('era-label')){
      if(s.classList.contains('set-block')&&!s.classList.contains('all-hidden')){v=true;break;}
      s=s.nextElementSibling;
    }
    lbl.classList.toggle('era-hidden',!v);
  });
  // Update set headers to show only active language names
  setBlockNamesMap.forEach(({namesByBadge,enName},block)=>{
    const nameEl=block.querySelector('.set-name-en'); if(!nameEl) return;
    const names=[...new Set(
      BADGE_ORDER.filter(b=>activeLangs.has(b)&&namesByBadge[b]).map(b=>namesByBadge[b])
    )];
    nameEl.textContent=names.length>0?names.join(' | '):enName;
  });
  updateStats();
}

function loadCache(){

}
function saveCache(d){ try{localStorage.setItem(CACHESTORE,JSON.stringify({ts:Date.now(),...d}));}catch(e){} }
function cacheAge(ts){
  const m=Math.floor((Date.now()-ts)/60000), h=Math.floor(m/60), dd=Math.floor(h/24);
  return dd>0?`${dd}d ago` : h>0?`${h}h ago` : m>0?`${m}m ago` : 'just now';
}
function updRefreshBtn(ts){
  const btn=document.getElementById('btn-refresh'); if(!btn) return;
  btn.disabled=false;
  btn.textContent=ts?`↺ Refresh (${cacheAge(ts)})`:'↺ Refresh';
  btn.title=ts?`Cached ${new Date(ts).toLocaleString()} — click to re-fetch`:'Fetch data from TCGdex';
}


// ── FETCH ─────────────────────────────────────────────────────────────────────
//
// Architecture:
//   Source of truth for card lists → Bulbapedia (CORS OK, has EN + JP)
//   EN images   → pokemontcg.io PNG  (primary) → TCGdex CDN (fallback) → placeholder
//   JP images   → Limitless CDN      (primary) → placeholder
//   Other langs → TCGdex CDN         (primary) → placeholder
//
// Language mapping:
//   JP is NOT hardcoded — card discovery is automatic via Bulbapedia wikitext.
//   JP_BULBA_SET_MAP is a static data table (set names → Limitless codes + metadata)
//   that only needs updating when new JP sets are released. The fetch/parse/inject
//   pipeline itself is fully dynamic.

// Parse EN card entries from Bulbapedia wikitext.
// Each {{card list/release}} block yields {pokemonName, enSet, num}.
function parseBulbaEN(wikitext, pokemonName){
  const cards=[];
  for(const m of wikitext.matchAll(/enset=([^|}\n]+)[^}]*?ennum=([^|}\n]+)/gs)){
    const enSet=m[1].trim();
    const rawNum=m[2].trim().split('/')[0].trim();
    // Numeric numbers: strip leading zeros (pokemontcg.io stores "5" not "005")
    // Non-numeric (promos like "XY23"): keep as-is
    const num=/^\d+$/.test(rawNum)?String(parseInt(rawNum,10)):rawNum;
    if(enSet&&num) cards.push({pokemonName,enSet,num});
  }
  return cards;
}

// Fetch Bulbapedia wikitext for all Pokémon in pokemonList.
// Returns {enCards:[{pokemonName,enSet,num}], jpCardsData:[{jpset,jpnum,pokemonName}]}
// Result is cached in _bulbaData so JP fetch doesn't re-fetch.
async function fetchBulbaData(){
  if(_bulbaData) return _bulbaData; // reuse within same session
  const results=await Promise.allSettled(pokemonList.map(name=>
    fetch(`https://bulbapedia.bulbagarden.net/w/api.php?action=parse&page=${encodeURIComponent(name+'_(TCG)')}&prop=wikitext&format=json&origin=*`)
      .then(r=>r.json())
      .then(d=>({name,text:d.parse?.wikitext?.['*']||''}))
      .catch(()=>({name,text:''}))
  ));
  const enCards=[], jpCardsData=[];
  results.forEach(r=>{
    if(r.status!=='fulfilled') return;
    const {name,text}=r.value;
    if(!text) return;
    enCards.push(...parseBulbaEN(text,name));
    jpCardsData.push(...parseBulbaJPCards(text).map(c=>({...c,pokemonName:name})));
  });
  _bulbaData={enCards,jpCardsData};
  return _bulbaData;
}

// Fetch all pokemontcg.io sets → Map<setName, setObj>
// Used to look up set metadata (id, releaseDate, symbol) from Bulbapedia EN set names.
async function fetchPtcgioSetsMap(){
  try{
    const r=await fetch('https://api.pokemontcg.io/v2/sets?pageSize=250&select=id,name,series,releaseDate,images,ptcgoCode');
    if(!r.ok) return new Map();
    const d=await r.json();
    return new Map((d.data||[]).map(s=>[s.name,s]));
  }catch(e){ return new Map(); }
}

async function fetchEnCards(){
  // 1. Fetch Bulbapedia + pokemontcg.io sets in parallel
  const [bulba, ptcgioSets]=await Promise.all([fetchBulbaData(), fetchPtcgioSetsMap()]);

  // 2. Build EN cards: Bulbapedia supplies card list, pokemontcg.io supplies metadata+images
  const cards=[];
  const seen=new Set();
  for(const {pokemonName,enSet,num} of bulba.enCards){
    const setData=ptcgioSets.get(enSet);
    if(!setData) continue; // set not in pokemontcg.io — will be caught by fallback
    const cardId=`${setData.id}-${num}`;
    if(seen.has(cardId)) continue;
    seen.add(cardId);
    cards.push({
      id:cardId, name:pokemonName, number:num, set:setData, ptcgoCode:setData.ptcgoCode||null,
      images:{
        small:`https://images.pokemontcg.io/${setData.id}/${num}.png`,
        large:`https://images.pokemontcg.io/${setData.id}/${num}_hires.png`,
      }
    });
  }
  if(cards.length) return cards;

  // 3. Fallback A: pokemontcg.io name search (if Bulbapedia or set mapping failed)
  console.warn('Bulbapedia→pokemontcg.io mapping failed, falling back to name search');
  const ptcgCards=[];
  await Promise.allSettled(pokemonList.map(async name=>{
    try{
      const r=await fetch(`https://api.pokemontcg.io/v2/cards?q=name:"${encodeURIComponent(name)}"&pageSize=250&select=id,name,number,set,images`);
      if(!r.ok) return;
      const d=await r.json();
      if(Array.isArray(d.data)) ptcgCards.push(...d.data);
    }catch(e){}
  }));
  if(ptcgCards.length) return ptcgCards;

  // 4. Fallback B: TCGdex (last resort)
  console.warn('pokemontcg.io also failed, falling back to TCGdex');
  const tcgCards=[]; const errors=[];
  for(const name of pokemonList){
    const urls=[
      `https://api.tcgdex.net/v2/en/cards?name=${encodeURIComponent(name)}`,
      `https://api.tcgdex.net/v2/en/cards?name=${encodeURIComponent(name.toLowerCase())}`,
    ];
    let ok=false;
    for(const url of urls){
      try{
        const r=await fetch(url); if(!r.ok) continue;
        const d=await r.json();
        if(Array.isArray(d)&&d.length){tcgCards.push(...d);ok=true;break;}
        if(d?.data?.length){tcgCards.push(...d.data);ok=true;break;}
      }catch(e){}
    }
    if(!ok) errors.push(`${name}:not found`);
  }
  if(!tcgCards.length) throw new Error(`All sources failed (${errors.slice(0,3).join('; ')})`);
  return tcgCards;
}

async function fetchSetNames(apiCode){
  try{
    const r=await fetch(`https://api.tcgdex.net/v2/${apiCode}/sets`);
    if(!r.ok) return {};
    const s=await r.json();
    return Array.isArray(s)?Object.fromEntries(s.map(x=>[x.id,x.name])):{};
  }catch(e){return {};}
}

// Fetch native Pokémon names for a given language by querying one card per
// unique species name. We use the card ID derived from the EN image URL.
// Returns { enName: nativeName, … }  — 3 requests total (one per species).

async function fetchAllSetNames(){
  const eligible=LANGUAGES.filter(l=>l.hasSetsApi&&l.apiCode);
  const results=await Promise.allSettled(eligible.map(l=>fetchSetNames(l.apiCode).then(n=>({code:l.code,names:n}))));
  const map={};
  results.forEach((r,i)=>{ map[eligible[i].code]=(r.status==='fulfilled')?r.value.names:{}; });
  return map;
}

function detectNew(oldCards,newCards){
  const old=new Set((oldCards||[]).map(c=>c.id));
  return newCards.filter(c=>!old.has(c.id));
}

// Build a Limitless image URL from a set code + card number string ("005/071")
function limitlessJpUrl(code, jpnum){
  if(!code||!jpnum) return null;
  const num=parseInt(jpnum.split('/')[0],10);
  if(isNaN(num)) return null;
  return `https://limitlesstcg.nyc3.cdn.digitaloceanspaces.com/tpc/${code}/${code}_${num}_R_JP_SM.png`;
}

// Parse all JP card entries from a Bulbapedia TCG wikitext string.
// Returns [{jpset, jpnum}] — one entry per {{card list/release}} block.
function parseBulbaJPCards(wikitext){
  const results=[];
  // Match each release block — jpset always comes before jpnum in the template
  for(const m of wikitext.matchAll(/jpset=([^|}\n]+)[^}]*?jpnum=([^|}\n]+)/gs)){
    results.push({jpset:m[1].trim(), jpnum:m[2].trim()});
  }
  return results;
}

async function fetchAndInjectJPCards(container){
  // 1. Reuse Bulbapedia data already fetched by fetchEnCards (or fetch fresh if needed)
  const bulba = await fetchBulbaData();

  // 2. Parse all JP card entries grouped by JP set name
  // jpSets: Map<bulbaSetName, {meta, cards:[{enName,jpnum,cardId}]}>
  const jpSets=new Map();
  let cardIndex=0;
  bulba.jpCardsData.forEach(({jpset,jpnum,pokemonName})=>{
    const meta=JP_BULBA_SET_MAP[jpset];
    if(!meta) return; // unknown set — not in our map, skip
    if(!jpSets.has(jpset)) jpSets.set(jpset,{...meta, bulbaName:jpset, cards:[]});
    jpSets.get(jpset).cards.push({enName:pokemonName, jpnum, cardId:`jp_${pokemonName}_${jpset}_${cardIndex++}`});
  });

  if(!jpSets.size) return;

  // 3. Sort sets by release date, respecting sortDesc
  const sortedSets=[...jpSets.values()].sort((a,b)=>{
    const diff=new Date(a.date)-new Date(b.date);
    return sortDesc?-diff:diff;
  });

  // 4. Inject each JP set block into the correct era
  sortedSets.forEach(si=>{
    // Find era label in DOM
    const eraLabel=container.querySelector(`.era-label[data-series="${si.era}"]`);
    let insertBefore=null;
    if(eraLabel){
      // Find correct insertion point by comparing JP set date vs EN set dates in this era
      const jpDate=new Date(si.date).getTime();
      let sib=eraLabel.nextElementSibling;
      while(sib&&!sib.classList.contains('era-label')){
        if(sib.classList.contains('set-block')){
          const sibDate=parseInt(sib.dataset.releaseDate||'0',10);
          if(sortDesc ? sibDate < jpDate : sibDate > jpDate){ insertBefore=sib; break; }
        }
        sib=sib.nextElementSibling;
      }
      // If no insertion point found within era, insert before next era
      if(!insertBefore){
        let s2=eraLabel.nextElementSibling;
        while(s2&&!s2.classList.contains('era-label')) s2=s2.nextElementSibling;
        insertBefore=s2;
      }
    }

    const block=document.createElement('div'); block.className='set-block';
    const symEl=si.sym?`<img class="set-symbol" src="${si.sym}" alt="" onerror="this.style.display='none'">`:'' ;
    block.innerHTML=`<div class="set-head c-orange"><div class="set-head-left">${symEl}<div class="set-name-block"><span class="set-name-en">${si.bulbaName} <span style="font-size:9px;opacity:.7">(JP)</span></span></div></div><div class="set-head-right"><span class="set-count">0 entries</span><button class="set-select-btn">☑ Set</button></div></div><div class="cards-grid"></div>`;
    if(insertBefore) container.insertBefore(block,insertBefore);
    else container.appendChild(block);
    block.querySelector('.set-select-btn').addEventListener('click',e=>{e.stopPropagation();selectSet(block);});
    setBlockNamesMap.set(block,{namesByBadge:{JP:si.bulbaName},enName:si.bulbaName});

    const grid=block.querySelector('.cards-grid');
    let count=0;

    // Group cards by Pokémon
    const byPokemon=new Map();
    si.cards.forEach(c=>{
      if(!byPokemon.has(c.enName)) byPokemon.set(c.enName,[]);
      byPokemon.get(c.enName).push(c);
    });

    byPokemon.forEach((cards,enName)=>{
      const jpNat=NATIVE_NAMES.JP?.[enName]||'';
      const divider=document.createElement('div'); divider.className='poke-divider';
      divider.innerHTML=`${enName}${jpNat?` <span class="poke-divider-names-alt">· ${jpNat}</span>`:''}`;
      grid.appendChild(divider);

      cards.forEach(({enName,jpnum,cardId})=>{
        const localId=jpnum.split('/')[0]; // "005" from "005/071"
        const id=`JP_${cardId}`, isDone=checked.has(id);
        const imgSrc=limitlessJpUrl(si.code,jpnum);
        const jpNatName=NATIVE_NAMES.JP?.[enName]||null;

        _meta.set(id,{
          name:{en:enName,native:jpNatName},
          setName:si.bulbaName, num:`#${localId}`,
          lang:'JP', langColor:'#4527a0',
          imgSrc, hiImgSrc:imgSrc, isCustom:true, symSrc:si.sym,
        });

        const el=document.createElement('div');
        el.className='card'+(isDone?' done':''); el.dataset.id=id; el.dataset.lang='JP';

        const wrap=document.createElement('div'); wrap.className='img-wrap';
        if(imgSrc){
          const img=document.createElement('img');
          img.className='card-img'; img.loading='lazy';
          img.alt=`${enName} JP #${localId}`; img.src=imgSrc;
          img.onload=()=>{ const mm=_meta.get(id); if(mm) mm.isCustom=false; };
          img.onerror=()=>{
            img.remove();
            wrap.innerHTML=buildPlaceholderHTML(si.sym,'JP','#4527a0',enName,jpNatName,si.bulbaName,localId,false);
          };
          wrap.appendChild(img);
        } else {
          wrap.innerHTML=buildPlaceholderHTML(si.sym,'JP','#4527a0',enName,jpNatName,si.bulbaName,localId,false);
        }

        const footer=document.createElement('div'); footer.className='card-footer';
        const chk=document.createElement('input'); chk.type='checkbox'; chk.className='chk';
        if(isDone) chk.checked=true; chk.onclick=e=>e.stopPropagation();
        footer.innerHTML=`<span class="card-num">#${localId}</span><span class="lang lang-JP">JP</span><button class="preview-btn" title="Preview">🔍</button>`;
        footer.appendChild(chk); el.appendChild(wrap); el.appendChild(footer);
        attachToggle(el,id); grid.appendChild(el); count++;
      });
    });
    totalCards+=count; updCount(block,count);
  });

  activeLangs.add('JP'); saveFilter();
  buildPills(); updateStats();
}
async function buildAll(forceRefresh){
  const container=document.getElementById('dyn');
  container.innerHTML=''; totalCards=0; setBlockNamesMap.clear();

  const loadBanner=mkBanner(container,'⏳ Loading…','banner-load',null);
  const btn=document.getElementById('btn-refresh');
  if(btn){btn.disabled=true;btn.textContent='⏳ Loading…';}

  try{
    const cached=loadCache();
    const fresh=forceRefresh||!cached||(Date.now()-cached.ts)>CACHE_TTL;
    let cards,setNamesAll;

    if(!fresh){
      cards=cached.cards; setNamesAll=cached.setNamesAll||{};
      loadBanner.remove();
      mkBanner(container,`✅ Loaded from cache (${cacheAge(cached.ts)}). Click Refresh to check for new cards.`,'banner-blue',null);
    } else {
      loadBanner.querySelector('.banner-body').textContent='⏳ Fetching cards, set names and translations from TCGdex…';
      [cards,setNamesAll]=await Promise.all([fetchEnCards(),fetchAllSetNames()]);

      // TH/ID TCGdex endpoints return 0 results — no native names available via API
      if(forceRefresh&&cached){
        const nc=detectNew(cached.cards,cards);
        loadBanner.remove();
        if(nc.length){
          mkBanner(container,`🆕 <strong>${nc.length} new card(s) found</strong>: ${[...new Set(nc.map(c=>c.name))].join(', ')}`,'banner-load',null);
        } else {
          mkBanner(container,'✅ No new cards since last check.','banner-green',null);
        }
      } else { loadBanner.remove(); }

      saveCache({cards,setNamesAll});
    }

    // Clear any remaining loading banner before rendering
    loadBanner?.remove?.();
    renderBySet(cards,setNamesAll,container);

    // JP: fetch all JP cards, filter by name, inject as own sets with images
    fetchAndInjectJPCards(container).catch(e=>console.warn('JP fetch failed:',e.message));

    updRefreshBtn(loadCache()?.ts);
    buildPills(); updateStats();

  }catch(err){
    if(loadBanner.parentNode) loadBanner.className='banner banner-error';
    if(loadBanner.parentNode) loadBanner.querySelector('.banner-body').innerHTML=`⚠️ Failed: ${err.message} <button id="retry-btn" style="margin-left:8px;padding:2px 8px;cursor:pointer;border-radius:3px;border:1px solid #880e4f;background:#fff;color:#880e4f;font-size:10px;">↺ Retry</button>`;
    loadBanner.querySelector('#retry-btn')?.addEventListener('click',()=>doRefresh());
    if(btn){btn.disabled=false;btn.textContent='↺ Refresh';}
  }
}

function doRefresh(){buildAll(true);}
function clearCache(){
  if(!confirm('Clear all cached card data and reload?')) return;
  // Remove all tcgData cache keys (any version)
  Object.keys(localStorage).filter(k=>k.startsWith('tcgData')).forEach(k=>localStorage.removeItem(k));
  _bulbaData=null;
  location.reload();
}

// ── DATA EXPORT (Phase 0: backup / device-transfer for the modular-site rebuild)
// Dumps every localStorage key beginning with "tcg" (MS checklist, TMS includes,
// settings, caches) into one JSON file. The envelope carries a schemaVersion and
// an ISO timestamp so the future static-site import screen can validate the blob
// and run the old-ID → TCGdex-ID migration. Additive only; reads localStorage,
// writes a download, mutates nothing in the running tool.
const EXPORT_SCHEMA_VERSION = 1;
function exportData(){
  const data = {};
  Object.keys(localStorage)
    .filter(k => k.startsWith('tcg'))
    .forEach(k => { data[k] = localStorage.getItem(k); });
  const payload = {
    tool: 'pokemon-master-set-tool',
    schemaVersion: EXPORT_SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    keys: data
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url  = URL.createObjectURL(blob);
  const stamp = payload.exportedAt.slice(0,10); // YYYY-MM-DD
  const a = document.createElement('a');
  a.href = url; a.download = `tcg-export-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function showPlaceholderInPreview(content, m, en, nat){
  const ph = buildPlaceholderHTML(m.symSrc, m.lang, m.langColor, en, nat, m.setName, m.num.replace('#',''), false);
  content.innerHTML = `<div class="preview-placeholder">${ph}</div>`;

function openPreview(id){
  const m=_meta.get(id); if(!m) return;
  const overlay=document.getElementById('preview-overlay');
  const content=document.getElementById('preview-content');
  const meta=document.getElementById('preview-meta');
  if(!overlay||!content||!meta) return;

  const en=typeof m.name==='object'?m.name.en:m.name;
  const nat=typeof m.name==='object'?m.name.native:null;

  // Try to show a real image: hi → lo → placeholder
  const hiSrc = m.hiImgSrc || m.imgSrc;
  const loSrc = m.imgSrc || m.hiImgSrc;

  if(hiSrc){
    content.innerHTML='';
    const img=document.createElement('img');
    img.className='preview-img'; img.alt=en;

    function tryLo(){
      if(loSrc && loSrc!==hiSrc){
        img.onerror=()=>{ img.remove(); showPlaceholderInPreview(content,m,en,nat); };
        img.src=loSrc;
      } else {
        img.remove(); showPlaceholderInPreview(content,m,en,nat);
      }
    }

    img.onerror=tryLo;
    img.src=hiSrc;
    content.appendChild(img);
  } else {
    showPlaceholderInPreview(content,m,en,nat);
  }

  meta.innerHTML=`
    <strong>${en}</strong>${nat?` · ${nat}`:''}
    <br>${m.setName} &middot; ${m.num} &middot;
    <span style="background:${m.langColor};color:white;padding:0 5px;border-radius:3px;font-size:10px">${m.lang}</span>
  `.trim();

  overlay.classList.add('open');
}

function closePreview(e){
  if(e && e.target!==document.getElementById('preview-overlay') && !e.target.classList.contains('preview-close')) return;
  document.getElementById('preview-overlay')?.classList.remove('open');

function printSelected(){
  if(!checked.size){ alert('No cards selected.'); return; }
  const cards = [...checked].map(id=>_meta.get(id)).filter(Boolean);
  if(!cards.length){ alert('No printable card data found.'); return; }

  function safeImgUrl(url, quality){
    if(!url) return null;
    return /\.(webp|png|jpg|jpeg)$/i.test(url) ? url : `${url}/${quality}.webp`;
  }

  const cells = cards.map(m => {
    const imgUrl = safeImgUrl(m.hiImgSrc,'high') || safeImgUrl(m.imgSrc,'low');
    const ph  = printPlaceholderCard(m);
    const img = imgUrl
      ? `<img src="${imgUrl}" class="pi pi-ov" style="display:none" onload="this.style.display='block'" onerror="this.remove()">`
      : '';
    return `<div class="pw">${ph}${img}</div>`;
  }).join('');

  // A4 portrait: 5mm margins = 200mm × 287mm usable
  // 3 × 63.5mm + 2 × 2mm gaps = 194.5mm wide ✓
  // 3 × 88.9mm + 2 × 2mm gaps = 270.7mm tall ✓ → 9 cards per page
  const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Print</title><style>'
    + '*{box-sizing:border-box;margin:0;padding:0;}'
    + 'body{background:white;}'
    + '.pg{display:grid;grid-template-columns:repeat(3,63.5mm);gap:3mm;padding:0;}'
    + '.pw{width:63.5mm;height:88.9mm;border-radius:3.5mm;overflow:hidden;position:relative;}'
    + '.pi{width:63.5mm;height:88.9mm;display:block;object-fit:cover;}'
    + '.pi-ov{position:absolute;inset:0;width:100%!important;height:100%!important;}'
    + PLACEHOLDER_PRINT_CSS
    + '@media print{-webkit-print-color-adjust:exact;print-color-adjust:exact;@page{size:A4 portrait;margin:5mm;}}'
    + '</style></head><body>'
    + '<div class="pg">' + cells + '</div>'
    + '<script>const i=document.querySelectorAll("img");let p=i.length;function t(){if(--p<=0)window.print();}if(!p)window.print();else i.forEach(x=>{if(x.complete)t();else{x.onload=t;x.onerror=t;}})<\/script>'
    + '</body></html>';

  const blob = new Blob([html], {type:'text/html'});
  const url  = URL.createObjectURL(blob);
  const win  = window.open(url, '_blank');
  if(!win) alert('Pop-up blocked — please allow pop-ups.');
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

// ── PRINT CHECKLIST ───────────────────────────────────────────────────────────
// Prints a text list of selected cards grouped by set, with checkboxes.
// One row per card: [ ] CardName · Lang · #Num
function printChecklist(){
  if(!checked.size){ alert('No cards selected.'); return; }
  const cards = [...checked].map(id=>_meta.get(id)).filter(Boolean);
  if(!cards.length){ alert('No card data found.'); return; }

  // Group by set name
  const bySet = new Map();
  cards.forEach(m=>{
    if(!bySet.has(m.setName)) bySet.set(m.setName,[]);
    bySet.get(m.setName).push(m);
  });

  // Build rows: 2 cards side-by-side per table row for compactness
  const rows = [...bySet.entries()].map(([setName, items])=>{
    const sym = items[0]?.symSrc
      ? `<img src="${items[0].symSrc}" style="width:10px;height:10px;object-fit:contain;vertical-align:middle;margin-right:2px;filter:brightness(0);opacity:.5" onerror="this.style.display='none'">`
      : '';
    let setRows = '';
    for(let i=0; i<items.length; i+=2){
      const cell = m => {
        if(!m) return '<td colspan="3"></td>';
        const en  = typeof m.name==='object' ? m.name.en : m.name;
        const nat = typeof m.name==='object' && m.name.native ? ` <span style="color:#999">${m.name.native}</span>` : '';
        return `<td class="chk-col"><input type="checkbox" disabled></td>`
             + `<td class="name-col">${en}${nat} <span class="badge" style="background:${m.langColor}">${m.lang}</span></td>`
             + `<td class="num-col">${m.num}</td>`;
      };
      setRows += `<tr>${cell(items[i])}${cell(items[i+1]||null)}</tr>`;
    }
    return `<tr class="set-row"><td colspan="6">${sym}${setName}</td></tr>${setRows}`;
  }).join('');

  const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Card Checklist</title><style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;font-size:7pt;padding:5mm;}
h1{font-size:8pt;margin-bottom:2mm;color:#333;}
table{width:100%;border-collapse:collapse;}
.set-row td{font-weight:bold;font-size:6.5pt;background:#ebebeb;padding:.8mm 1.5mm;border-top:.5px solid #bbb;color:#444;text-transform:uppercase;letter-spacing:.3px;} .name-col{max-width:60mm;}
tr:not(.set-row) td{padding:.35mm 1.5mm;border-bottom:.15mm solid #f2f2f2;vertical-align:middle;line-height:1.3;}
.chk-col{width:4mm;text-align:center;}.sep{width:1.5mm;border-left:.2mm solid #ddd;}
.lang-col{width:9mm;text-align:center;}
.num-col{width:9mm;text-align:right;color:#999;}
.badge{color:white;padding:0 2px;border-radius:2px;font-size:6pt;font-weight:bold;}
@media print{@page{size:A4 portrait;margin:5mm;}-webkit-print-color-adjust:exact;print-color-adjust:exact;}
</style></head>
<body>
<h1>${pokemonList.join(' · ')} — ${cards.length} card${cards.length===1?'':'s'}</h1>
<table><tbody>${rows}</tbody></table>
<\x73cript>window.print();<\/script>
</body></html>`;

  const blob = new Blob([html], {type:'text/html'});
  const url  = URL.createObjectURL(blob);
  const win  = window.open(url, '_blank');
  if(!win) alert('Pop-up blocked — please allow pop-ups.');
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
