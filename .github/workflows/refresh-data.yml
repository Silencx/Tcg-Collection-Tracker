name: Refresh card data

# Monday: everything. The other six days: only the Japanese card list and its images,
# which fit PokéWallet's free tier (100 requests an hour) only in small daily steps — see
# tools/build-jp-catalog.mjs, COST. A daily run also keeps the PokéWallet cache in use:
# GitHub evicts a cache nobody restores for 7 days.
on:
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 6 * * 0,2-6'
  workflow_dispatch:
    inputs:
      add:
        description: 'Pokémon to ADD to data/prebuilt.json permanently, comma-separated (e.g. "Pikachu,Eevee"). Leave blank to just rebuild the existing list.'
        required: false
        default: ''

permissions:
  contents: write

# A manual run started while the scheduled one is going waits for it, so the two never
# race to push.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # A manual run APPENDS to data/prebuilt.json rather than building a one-off
      # snapshot, which the next scheduled run would silently overwrite; widening
      # coverage has to be durable to be worth anything.
      - name: Extend the prebuilt list
        if: ${{ inputs.add != '' }}
        env:
          ADD: ${{ inputs.add }}
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "data/prebuilt.json";
            const current = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, "utf8")) : [];
            const add = process.env.ADD.split(",").map(s => s.trim()).filter(Boolean);
            const merged = [...new Set([...current, ...add])];
            if (merged.length > 60) throw new Error(`prebuilt list would reach ${merged.length}; cap is 60 (each entry costs a list request plus pooled detail calls every week)`);
            fs.writeFileSync(file, JSON.stringify(merged, null, 2) + "\n");
            console.log(`prebuilt list: ${current.length} -> ${merged.length}`);
          '

      # No argument: build-data.mjs reads data/prebuilt.json, falling back to
      # DEFAULT_POKEMON. It writes data/sets.json, the per-Pokémon shards under
      # data/cards|jp/, and data/index.json. Mondays and manual runs only.
      - name: Build data
        if: ${{ github.event.schedule != '0 6 * * 0,2-6' }}
        run: node tools/build-data.mjs

      # PokéWallet's raw answer for every Japanese set, kept from run to run so a run only
      # pays for what may have changed. A new key each run, restored by prefix, so the
      # newest copy wins. It holds PokéWallet's own card ids, so it is never committed;
      # note that any workflow in this repository, a pull request's included, could
      # restore it.
      - name: Restore the PokéWallet cache
        uses: actions/cache/restore@v6
        with:
          path: tools/.cache/pokewallet/jp-sets
          key: pokewallet-jp-sets-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pokewallet-jp-sets-

      # The Japanese card list (data/jp-cat/: every Japanese set, any Pokémon). With the
      # cache: new sets, sets whose card count changed, and the 40 read longest ago —
      # ≈45 requests, every set re-read within ~14 days. With the cache lost: the whole
      # walk again, over several days on the free tier, and only a COMPLETE walk replaces
      # the committed files, so the list stays as it was meanwhile. The key is optional:
      # without it the script exits cleanly. continue-on-error: a PokéWallet outage must
      # not cost the rest of the run.
      - name: Build Japanese card list
        continue-on-error: true
        env:
          POKEWALLET_IO_PROD_KEY: ${{ secrets.POKEWALLET_IO_PROD_KEY }}
        run: node tools/build-jp-catalog.mjs --rotate 40

      - name: Save the PokéWallet cache
        if: ${{ always() && hashFiles('tools/.cache/pokewallet/jp-sets/*.json') != '' }}
        uses: actions/cache/save@v6
        with:
          path: tools/.cache/pokewallet/jp-sets
          key: pokewallet-jp-sets-${{ github.run_id }}-${{ github.run_attempt }}

      # Low-res scans for Japanese cards no other source has art for, from the catalogue the
      # step above just built. Committed images are never fetched again, so a normal day
      # costs only the cards that are new; whatever the hour's quota leaves for, the next
      # day picks up. Same key, same continue-on-error.
      - name: Fetch new Japanese card images
        continue-on-error: true
        env:
          POKEWALLET_IO_PROD_KEY: ${{ secrets.POKEWALLET_IO_PROD_KEY }}
        run: node tools/build-images.mjs --all --max 300

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ img/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh card data"
            git push
          fi
