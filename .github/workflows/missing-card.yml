name: Missing card report

# A "Missing card" issue (.github/ISSUE_TEMPLATE/missing-card.yml) becomes either a pull
# request that adds one row to data/overrides.json, or a comment saying what to fix.
# Editing the issue checks it again.
#
# The issue body is untrusted: anyone can open an issue. It reaches the script only as
# an environment variable, never as ${{ }} inside run:, where it would be pasted into the
# shell script. Everything posted back is written by tools/missing-card.mjs, which
# quotes a reporter's words only inside code spans.
#
# It never pushes to main: the row goes on a branch of its own, missing-card/issue-N,
# and a person merges the pull request. Pull requests opened with the workflow token
# start no other workflow, so CI runs when it is merged.
#
# Needs, once: Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests". Without it the check still runs and comments, but opening the
# pull request fails (see README, "Missing cards").
on:
  issues:
    types: [opened, edited]

permissions: {}

# A later edit supersedes an earlier one still being checked.
concurrency:
  group: missing-card-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: >-
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, 'missing-card') ||
       startsWith(github.event.issue.title, '[Missing card]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the missing-card/issue-N branch
      pull-requests: write   # open, update or close its pull request
      issues: write          # labels and comments on the report
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The form sets the label, but only if it exists; a report whose title came from
      # the form gets it here.
      - name: Label the report
        run: |
          gh label create missing-card --color 1d76db --description "A card the tracker does not list" 2>/dev/null || true
          gh label create needs-info --color fbca04 --description "The report needs a fix before it can become a pull request" 2>/dev/null || true
          gh issue edit "$ISSUE_NUMBER" --add-label missing-card

      - name: Check the report
        id: check
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node tools/missing-card.mjs --out "$RUNNER_TEMP/missing-card"

      - name: Open or update the pull request
        if: steps.check.outputs.valid == 'true' && steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) echo "unexpected issue number"; exit 1;; esac
          out="$RUNNER_TEMP/missing-card"
          branch="missing-card/issue-$ISSUE_NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add data/overrides.json
          git commit --file "$out/commit-msg.txt"
          git push --force origin "HEAD:refs/heads/$branch"
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$(cat "$out/title.txt")" --body-file "$out/pr-body.md"
          else
            gh pr create --base "$BASE_BRANCH" --head "$branch" --title "$(cat "$out/title.txt")" --body-file "$out/pr-body.md"
          fi

      - name: Clear the needs-info label
        if: steps.check.outputs.valid == 'true'
        run: gh issue edit "$ISSUE_NUMBER" --remove-label needs-info 2>/dev/null || true

      # An edit that breaks a report which had a pull request closes it: the comment
      # below says what to fix, and the next valid edit opens a fresh one.
      - name: Ask for a fix
        if: steps.check.outputs.valid == 'false'
        run: |
          set -euo pipefail
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) echo "unexpected issue number"; exit 1;; esac
          gh issue edit "$ISSUE_NUMBER" --add-label needs-info
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/missing-card/comment.md"
          pr=$(gh pr list --head "missing-card/issue-$ISSUE_NUMBER" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr close "$pr" --delete-branch --comment "The report in #$ISSUE_NUMBER was edited and no longer checks out."
          fi
