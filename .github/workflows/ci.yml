name: CI

# Push on main only: a branch with an open PR is already checked by pull_request, and
# running both doubled every PR's checks.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run checks
        run: npm run check

      - name: Run tests
        run: npm test
